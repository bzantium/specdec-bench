[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "specdec-bench"
dynamic = ["version"]
description = "Standalone speculative decoding evaluation from NVIDIA Model-Optimizer"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["numpy", "PyYAML", "torch", "transformers", "tqdm"]

[project.optional-dependencies]
evaluation = ["datasets>=3.1.0", "pandas", "tiktoken>=0.12.0", "matplotlib", "rich>=14.2.0"]
dev = ["pytest"]

[project.urls]
Repository = "https://github.com/bzantium/specdec-bench"
Upstream = "https://github.com/NVIDIA/Model-Optimizer"

[tool.setuptools.dynamic]
version = {attr = "specdec_bench.__version__"}

[tool.setuptools.packages.find]
include = ["specdec_bench*"]
